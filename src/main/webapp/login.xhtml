<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Anmeldung – Like Hero To Zero</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>
    <main class="page login-page">

        <header class="page-header">
            <h1>Like Hero To Zero</h1>
            <p>Geschützter Wissenschaftsbereich</p>
        </header>

        <h:form styleClass="card">
            <h2>Anmeldung für Wissenschaftler</h2>

            <div class="form-grid">
                <h:outputLabel for="email" value="E-Mail-Adresse:"/>
                <h:inputText
                    id="email"
                    value="#{authenticationController.email}"
                    required="true"
                    requiredMessage="Bitte eine E-Mail-Adresse eingeben."/>

                <h:outputLabel for="password" value="Passwort:"/>
                <h:inputSecret
                    id="password"
                    value="#{authenticationController.password}"
                    required="true"
                    requiredMessage="Bitte ein Passwort eingeben."/>

                <h:messages styleClass="message"/>

                <h:commandButton
                    value="Anmelden"
                    action="#{authenticationController.login}"/>
            </div>

            <div class="actions">
                <h:link
                    outcome="index"
                    value="Zur öffentlichen Übersicht"/>
            </div>
        </h:form>

    </main>
</h:body>
</html>
