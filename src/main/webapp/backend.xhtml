<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<f:metadata>
        <f:viewAction action="#{authenticationController.checkLogin}"/>
</f:metadata>

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wissenschaftsbereich – Like Hero To Zero</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>
    <main class="page backend-page">

        <header class="page-header">
            <h1>Wissenschaftsbereich</h1>
            <p>
                Willkommen,
                <h:outputText
                    value="#{authenticationController.scientistName}"/>!
            </p>
        </header>

        <h:form styleClass="card">
            <h2>Emissionswert hinzufügen oder korrigieren</h2>

            <div class="form-grid">
                <h:outputLabel for="country" value="Land:"/>

                <h:selectOneMenu
                    id="country"
                    value="#{backendController.countryId}"
                    required="true"
                    requiredMessage="Bitte ein Land auswählen.">

                    <f:selectItem
                        itemLabel="Bitte ein Land auswählen"
                        itemValue="#{null}"
                        noSelectionOption="true"/>

                    <f:selectItems
                        value="#{backendController.countries}"
                        var="country"
                        itemValue="#{country.id}"
                        itemLabel="#{country.name}"/>
                </h:selectOneMenu>

                <h:outputLabel for="year" value="Jahr:"/>

                <h:inputText
                    id="year"
                    value="#{backendController.year}"
                    required="true"
                    requiredMessage="Bitte ein Jahr eingeben.">

                    <f:validateLongRange
                        minimum="1750"
                        maximum="2100"/>
                </h:inputText>

                <h:outputLabel
                    for="emissions"
                    value="CO₂-Emissionen in Kilotonnen:"/>

                <h:inputText
                    id="emissions"
                    value="#{backendController.co2EmissionsKt}"
                    required="true"
                    requiredMessage="Bitte einen Emissionswert eingeben.">

                    <f:validateDoubleRange minimum="0"/>
                </h:inputText>

                <h:messages styleClass="message"/>

                <h:commandButton
                    value="Speichern"
                    action="#{backendController.save}"/>
            </div>

            <h:outputText
                value="#{backendController.message}"
                rendered="#{not empty backendController.message}"
                styleClass="message"/>

            <div class="actions">
                <h:commandButton
                    value="Abmelden"
                    action="#{authenticationController.logout}"
                    immediate="true"/>

                <h:link
                    outcome="index"
                    value="Zur öffentlichen Übersicht"/>
            </div>
        </h:form>

    </main>
</h:body>
</html>
