<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction
            action="#{authenticationController.checkLogin}"/>
    </f:metadata>

    <h:head>
        <title>Wissenschaftsbereich – Like Hero To Zero</title>
    </h:head>

    <h:body>
        <h1>Wissenschaftsbereich</h1>

        <p>
            Willkommen,
            <h:outputText
                value="#{authenticationController.scientistName}"/>!
        </p>

        <h2>Emissionswert hinzufügen oder korrigieren</h2>

        <h:form>
            <p>
                <h:outputLabel
                    for="country"
                    value="Land:"/>
                <br/>
                <h:selectOneMenu
                    id="country"
                    value="#{backendController.countryId}"
                    required="true"
                    requiredMessage="Bitte ein Land auswählen.">

                    <f:selectItem
                        itemLabel="Bitte Land auswählen"
                        itemValue="#{null}"
                        noSelectionOption="true"/>

                    <f:selectItems
                        value="#{backendController.countries}"
                        var="country"
                        itemValue="#{country.id}"
                        itemLabel="#{country.name}"/>
                </h:selectOneMenu>
                <br/>
                <h:message for="country"/>
            </p>

            <p>
                <h:outputLabel
                    for="year"
                    value="Jahr:"/>
                <br/>
                <h:inputText
                    id="year"
                    value="#{backendController.year}"
                    required="true"
                    requiredMessage="Bitte ein Jahr eingeben.">

                    <f:validateLongRange
                        minimum="1900"
                        maximum="2100"/>
                </h:inputText>
                <br/>
                <h:message for="year"/>
            </p>

            <p>
                <h:outputLabel
                    for="emissions"
                    value="CO₂-Emissionen in Kilotonnen:"/>
                <br/>
                <h:inputText
                    id="emissions"
                    value="#{backendController.co2EmissionsKt}"
                    required="true"
                    requiredMessage="Bitte einen Emissionswert eingeben.">

                    <f:validateDoubleRange minimum="0"/>
                </h:inputText>
                <br/>
                <h:message for="emissions"/>
            </p>

            <h:commandButton
                value="Speichern"
                action="#{backendController.save}"/>

            <h:panelGroup
                rendered="#{not empty backendController.message}">
                <p>
                    <h:outputText
                        value="#{backendController.message}"/>
                </p>
            </h:panelGroup>
        </h:form>

        <h:form>
            <h:commandButton
                value="Abmelden"
                action="#{authenticationController.logout}"/>
        </h:form>

        <p>
            <h:link
                outcome="index"
                value="Zur öffentlichen Übersicht"/>
        </p>
    </h:body>
</html>
